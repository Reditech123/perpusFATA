<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--muted:#5b6b70;--line:#dde5e3;--bg:#f4f1ea;--card:#fff;--brand:#1f4e5a;--brand2:#2f6f7e;--soft:#e6efed;
--ok:#1e7a4c;--okbg:#e3f3ea;--warn:#a2620a;--warnbg:#fcf0d9;--bad:#b3261e;--badbg:#fbe5e3;--accent:#c8873a;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--brand);color:#fff;padding:14px 16px 18px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;right:-30px;top:-20px;width:150px;height:150px;border-radius:50%;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 6px,transparent 6px 12px)}
.top .brand{display:flex;gap:10px;align-items:center;max-width:860px;margin:0 auto;position:relative;z-index:1}
.top .mark{width:38px;height:38px;border-radius:10px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.top small{opacity:.8;font-size:12.5px}
main{max-width:860px;margin:0 auto;padding:16px 16px 96px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
.tabs button{flex:1;max-width:215px;text-align:center;padding:9px 4px 11px;color:var(--muted);background:none;border:0;cursor:pointer;font-size:12.5px;font-weight:600}
.tabs button svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.tabs button.on{color:var(--brand)}
.tabs button.on svg{stroke:var(--brand)}
.linkbtn{background:none;border:0;padding:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
body.kiosk .tabs{display:none}
body.kiosk main{padding-bottom:24px}
h2{font-size:20px;margin:6px 0 12px}
h3{font-size:15.5px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,111,126,.15)}
input.big{font-size:26px;letter-spacing:2px;text-align:center;padding:14px;font-weight:600}
label.f{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:46px;height:46px;flex:0 0 46px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px;stroke:var(--brand)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.alert{border-radius:12px;padding:11px 13px;margin:10px 0;font-size:14px}
.alert.ok{background:var(--okbg);color:var(--ok)}.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.info{background:var(--soft);color:var(--brand)}
.hero{padding:6px 2px 10px}
.hero h2{font-size:24px;margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--brand);color:var(--brand);background:var(--soft)}
.book{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.spine{width:40px;flex:0 0 40px;height:56px;border-radius:5px;background:var(--brand2);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;text-align:center;line-height:1.15;padding:3px}
.book .t{font-weight:700;line-height:1.3}
.book .m{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile b{display:block;font-size:22px;line-height:1.2}
.tile span{font-size:12.5px;color:var(--muted)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.menu button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 12px;text-align:left;cursor:pointer}
.menu button b{display:block;font-size:15px;margin-top:6px}
.menu button span{font-size:12.5px;color:var(--muted)}
.menu svg{width:26px;height:26px;stroke:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.purpose{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.purpose button{padding:16px 8px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.purpose button:hover{border-color:var(--brand)}
.done{text-align:center;padding:26px 10px}
.done .ck{width:74px;height:74px;border-radius:50%;background:var(--okbg);display:grid;place-items:center;margin:0 auto 10px}
.done .ck svg{width:40px;height:40px;stroke:var(--ok)}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;width:min(92vw,480px)}
#toast div{padding:11px 14px;border-radius:12px;background:var(--ink);color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#toast .ok{background:var(--ok)}#toast .bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(10,25,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 22px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet .hd h3{margin:0;flex:1}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--brand)}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#0d1b1e;min-height:220px;position:relative}
#reader video{border-radius:12px}
.zoom{display:flex;gap:6px;margin:8px 0}
.zoom button{flex:1;padding:8px 0;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.zoom button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.scanres{min-height:46px;border-radius:12px;padding:11px 13px;margin-top:8px;font-weight:600}
.scanlog{max-height:180px;overflow:auto;font-size:13px;margin-top:8px}
.scanlog div{padding:6px 0;border-bottom:1px dashed var(--line)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{padding:30px;text-align:center;color:var(--muted)}
.bars{width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hidden{display:none!important}
.katgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.katgrid button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.katgrid button b{display:block;font-size:17px;color:var(--brand)}
.katgrid button span{display:block;font-size:13px;font-weight:600;line-height:1.3}
.katgrid button i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.menu button{position:relative}
.cnt{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-style:normal;font-weight:700;font-size:12px;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
.cntin{background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:11px}
.notif{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.notif button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 8px;text-align:left;cursor:pointer}
.notif button b{display:block;font-size:20px;color:var(--muted)}
.notif button span{font-size:11.5px;color:var(--muted);line-height:1.2;display:block}
.notif button.on{border-color:var(--warn);background:var(--warnbg)}
.notif button.on b{color:var(--warn)}
.verif{display:flex;gap:8px;align-items:flex-start;background:var(--warnbg);color:#6b4a0a;border-radius:10px;padding:10px;font-size:13.5px;cursor:pointer}
.verif input{width:20px;height:20px;flex:0 0 20px;margin:0}
.idt th{font-weight:600}
.mcard{background:linear-gradient(135deg,#1f4e5a,#2f6f7e);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.mcard .mtop{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px}
.mcard .mtop span{display:block;opacity:.8}
.mcard .mtag{border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:2px 6px;font-size:10.5px;letter-spacing:1px}
.mcard .mname{font-size:19px;font-weight:700;margin-top:12px}
.mcard .msub{font-size:13px;opacity:.9}
.mcard .mbar{background:#fff;border-radius:8px;padding:6px 10px;margin-top:10px;height:62px}
.mcard .mbar svg{width:100%;height:50px;display:block}
.kartusheet{display:grid;grid-template-columns:8.6cm 8.6cm;gap:.3cm;justify-content:center}
.kartu{width:8.6cm;height:5.4cm;border:.6pt solid #000;border-radius:3mm;padding:3mm 4mm;font-family:Arial,sans-serif;color:#000;display:flex;flex-direction:column;break-inside:avoid;box-sizing:border-box}
.kartu .kh{display:flex;justify-content:space-between;font-size:7.5pt;border-bottom:.6pt solid #000;padding-bottom:1mm}
.kartu .kh span{font-size:7pt}
.kartu .kt{font-size:6.5pt;letter-spacing:1pt;margin-top:1mm}
.kartu .kn{font-size:11pt;font-weight:700;margin-top:1mm;line-height:1.15}
.kartu .ks{font-size:8pt}
.kartu .kb{flex:1;display:flex;align-items:center}
.kartu .kb svg{width:100%;height:1.2cm}
.kartu .kf{font-size:6.5pt}
#printArea{display:none}
@media print{
 @page{size:A4;margin:8mm}
 body{background:#fff}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block}
}
.lblsheet{display:grid;grid-template-columns:9cm 9cm;justify-content:center}
.lbl{width:9cm;height:4.4cm;border:.6pt solid #000;display:flex;font-family:Arial,Helvetica,sans-serif;color:#000;break-inside:avoid;overflow:hidden;margin:-.3pt 0 0 -.3pt}
.lbl .l{width:3.3cm;border-right:.6pt solid #000;display:flex;flex-direction:column}
.lbl .lh{height:1.15cm;border-bottom:.6pt solid #000;text-align:center;font-size:8pt;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.lbl .lh b{font-size:8.5pt}
.lbl .lc{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;font-weight:700;font-size:11pt;line-height:1.22}
.lbl .r{flex:1;display:flex;align-items:center;padding-left:.25cm;gap:.12cm}
.lbl .bcw{position:relative;width:2.05cm;height:3.9cm;flex:0 0 2.05cm}
.lbl .bcw svg{position:absolute;width:3.9cm;height:2cm;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.lbl .code{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;font-size:9pt;height:3.9cm;text-align:center}
.lbl .tt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9pt;line-height:1.25;height:3.9cm;max-width:1.9cm;overflow:hidden;text-align:center}
.raklbl{width:9cm;height:4.4cm;border:.6pt dashed #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,sans-serif;margin:-.3pt 0 0 -.3pt;break-inside:avoid}
.raklbl b{font-size:26pt}
.raklbl svg{width:7cm;height:1.5cm}
</style>
</head>

const S = { token: '', who: null, info: {} };
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- server ---------- */
const IN_GAS = !!(window.google && google.script && google.script.run);
const apiReady = () => IN_GAS || /^https:\/\/script\.google(usercontent)?\.com\//.test(String(window.API_URL || ''));
function handle(txt, resolve, reject) {
  let r; try { r = typeof txt === 'string' ? JSON.parse(txt) : txt; } catch (e) { reject(new Error('Respons server tidak valid. Pastikan Web App diakses "Siapa saja".')); return; }
  if (r.ok) resolve(r.data);
  else if (r.error === 'SESI_HABIS') { clearSess(); toast('Sesi berakhir, silakan masuk lagi.', 'bad'); route(); reject(new Error('Sesi berakhir.')); }
  else reject(new Error(r.error));
}
function call(action, payload) {
  return new Promise((resolve, reject) => {
    if (IN_GAS) {
      google.script.run
        .withSuccessHandler(txt => handle(txt, resolve, reject))
        .withFailureHandler(e => reject(new Error((e && e.message) || 'Gagal terhubung ke server. Periksa internet.')))
        .api(action, payload || {}, S.token || '');
      return;
    }
    if (!apiReady()) { reject(new Error('API_URL belum diisi di index.html.')); return; }
    // text/plain agar tidak ada preflight CORS; Apps Script membalas dengan JSON.
    fetch(window.API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, payload: payload || {}, token: S.token || '' }) })
      .then(res => res.text())
      .then(txt => handle(txt, resolve, reject))
      .catch(() => reject(new Error('Gagal terhubung ke server. Periksa internet dan API_URL.')));

let AC = null;

  } catch (e) {}

}
function scanField(id, ph, mode) {

/* ---------- scanner (kamera live, foto, scanner USB) ---------- */
const FORMATS = () => window.Html5QrcodeSupportedFormats ? [Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
  Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8, Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.QR_CODE,
  Html5QrcodeSupportedFormats.CODABAR, Html5QrcodeSupportedFormats.ITF] : undefined;
let SC = null;
function openScanner(opts) {
  const m = modal(opts.title || 'Scan barcode',
    '<p class="small muted" style="margin:0 0 8px">' + esc(opts.hint || 'Arahkan kamera ke barcode. Barcode tegak? Putar HP agar garis barcode tegak lurus terhadap layar.') + '</p>' +
    '<div id="reader"></div>' +
    '<div class="zoom" id="zoomRow"><button data-z="1" class="on">1×</button><button data-z="2">2×</button><button data-z="3">3×</button><button data-z="4">4×</button></div>' +
    '<div class="small muted" id="zoomNote"></div>' +
    '<div class="row" style="margin-top:6px"><button class="btn sec grow" id="btnLive">Kamera live</button><button class="btn sec grow" id="btnFoto">Mode foto</button></div>' +
    '<input type="file" id="fotoIn" accept="image/*" capture="environment" class="hidden">' +
    '<label class="f">Atau ketik / pakai scanner USB</label><div class="row"><input id="manualCode" class="grow" autocomplete="off" placeholder="Kode barcode lalu Enter"><button class="btn" id="manualOk">OK</button></div>' +
    '<div class="scanres" id="scanRes"></div>' + (opts.continuous ? '<div class="scanlog" id="scanLog"></div>' : ''),
    () => stopCam());
  let lastCode = '', lastAt = 0, busyNow = false;
  const res = $('#scanRes');
  const show = (txt, type) => { res.className = 'scanres alert ' + (type || 'info'); res.textContent = txt; };
  show(opts.continuous ? 'Siap. Scan buku satu per satu.' : 'Menunggu barcode...', 'info');
  async function handle(code) {
    code = String(code || '').trim(); if (!code || busyNow) return;
    if (code === lastCode && Date.now() - lastAt < 2500) return;
    lastCode = code; lastAt = Date.now(); busyNow = true;
    try { if (SC && SC.getState && SC.getState() === 2) SC.pause(true); } catch (e) {}
    show('Memproses ' + code + '...', 'info');
    try {
      const r = (await opts.onCode(code)) || {};
      beep(true); show('Berhasil di-scan: ' + code + (r.msg ? ' — ' + r.msg : ''), 'ok');
      if (opts.continuous) { const lg = $('#scanLog'); if (lg) lg.insertAdjacentHTML('afterbegin', '<div>✔ <b>' + esc(code) + '</b> ' + esc(r.msg || '') + '</div>'); }
      else { setTimeout(() => m.close(), 700); }
    } catch (e) {
      beep(false); show('Gagal: ' + e.message, 'bad');
      if (opts.continuous) { const lg = $('#scanLog'); if (lg) lg.insertAdjacentHTML('afterbegin', '<div style="color:var(--bad)">✖ <b>' + esc(code) + '</b> ' + esc(e.message) + '</div>'); }
    } finally {
      busyNow = false;
      setTimeout(() => { try { if (SC && SC.getState && SC.getState() === 3) SC.resume(); } catch (e) {} }, 900);
    }
  }
  $('#manualOk').onclick = () => { const v = $('#manualCode').value; $('#manualCode').value = ''; handle(v); };
  $('#manualCode').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#manualOk').click(); } });
  $('#btnFoto').onclick = () => $('#fotoIn').click();
  $('#btnLive').onclick = () => startCam(handle, show);
  $('#fotoIn').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    show('Membaca barcode dari foto...', 'info');
    try { handle(await decodeFile(f)); } catch (err) { beep(false); show(err.message, 'bad'); }
  };
  $$('#zoomRow button').forEach(b => b.onclick = () => setZoom(+b.dataset.z));
  startCam(handle, show);
}
async function startCam(handle, show) {
  await stopCam();
  if (!window.Html5Qrcode) { show('Pustaka kamera gagal dimuat. Gunakan Mode foto atau scanner USB.', 'warn'); return; }
  try {
    SC = new Html5Qrcode('reader', { formatsToSupport: FORMATS(), verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    await SC.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.8); return { width: s, height: s }; } },
      txt => handle(txt), () => {});
    setZoom(1, true);
  } catch (e) {
    SC = null;
    const blocked = /NotAllowed|Permission|policy/i.test(String(e && (e.name || e.message || e)));
    $('#reader').innerHTML = '<div style="color:#fff;padding:22px;text-align:center;font-size:14px">' +
      (blocked ? 'Kamera live tidak diizinkan di halaman ini.<br>Tekan <b>Mode foto</b>: kamera HP terbuka, potret barcode-nya.' : 'Kamera tidak dapat dibuka.<br>Gunakan <b>Mode foto</b> atau scanner USB.') + '</div>';
    $('#zoomRow').classList.add('hidden');
  }
}
async function stopCam() { if (SC) { try { await SC.stop(); } catch (e) {} try { SC.clear(); } catch (e) {} SC = null; } }
function setZoom(v, silent) {
  $$('#zoomRow button').forEach(b => b.classList.toggle('on', +b.dataset.z === v));
  const note = $('#zoomNote'); if (!SC) return;
  try {
    const z = SC.getRunningTrackCameraCapabilities().zoomFeature();
    if (z.isSupported()) {
      const val = Math.min(z.max(), Math.max(z.min(), z.min() * v));
      z.apply(val); note.textContent = 'Zoom ' + v + '× (maks. ' + Math.round(z.max() / z.min() * 10) / 10 + '×)';
    } else if (!silent || v > 1) note.textContent = 'Kamera ini tidak mendukung zoom. Dekatkan HP ke barcode atau pakai Mode foto.';
  } catch (e) { note.textContent = 'Zoom tidak tersedia di perangkat ini.'; }
}
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Foto tidak dapat dibuka.')); i.src = u; });
}
async function decodeFile(file) {
  const img = await loadImg(file);
  for (const deg of [0, 90]) {
    const scale = Math.min(1, 1800 / Math.max(img.width, img.height));
    const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
    const c = document.createElement('canvas'), x = c.getContext('2d');
    if (deg) { c.width = h; c.height = w; x.translate(h / 2, w / 2); x.rotate(Math.PI / 2); x.drawImage(img, -w / 2, -h / 2, w, h); }
    else { c.width = w; c.height = h; x.drawImage(img, 0, 0, w, h); }
    if ('BarcodeDetector' in window) {
      try { const r = await new BarcodeDetector().detect(c); if (r && r.length) return r[0].rawValue; } catch (e) {}
    }
    if (window.Html5Qrcode) {
      try {
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
        const q = new Html5Qrcode('readerFile', { formatsToSupport: FORMATS(), verbose: false });
        const t = await q.scanFile(new File([blob], 'scan.jpg', { type: 'image/jpeg' }), false);
        try { q.clear(); } catch (e) {}
        if (t) return t;
      } catch (e) {}
    }
  }
  throw new Error('Barcode tidak terbaca di foto. Ulangi lebih dekat, terang, dan tidak buram.');
}

    const set = (k, v) => { const el = $('[data-cnt="' + k + '"]'); if (el && v) { el.textContent = v; el.classList.remove('hidden'); } };
    set('total', total); set('kembali', n.kembali);
    $('#ptNotif').innerHTML = '<div class="notif">' + [['Booking perlu ACC', n.booking, 'booking'], ['Peminjaman perlu ACC', n.pinjam, 'pinjam'], ['Pengembalian perlu ACC', n.kembali, 'kembali'],
      ['Perpanjangan perlu ACC', n.perpanjang, 'perpanjang'], ['Jadwal ambil hari ini', n.jadwalHariIni, 'jadwal'], ['Denda belum lunas', n.denda, 'denda']]
      .map(x => '<button data-nav="petugas/persetujuan/' + x[2] + '" class="' + (x[1] ? 'on' : '') + '"><b>' + x[1] + '</b><span>' + x[0] + '</span></button>').join('') + '</div>';
  }).catch(() => {});
}
function back(title) { return '<div class="row" style="margin-bottom:8px"><button type="button" class="btn ghost sm" data-nav="petugas">&larr; Menu</button><h2 class="grow" style="margin:0">' + esc(title) + '</h2></div>'; }

function identitasHtml(m) {
  if (!m) return '<div class="alert bad">Data anggota tidak ditemukan.</div>';
  const row = (k, v) => v ? '<tr><th style="width:38%">' + k + '</th><td>' + esc(v) + '</td></tr>' : '';
  return '<table class="idt">' + row('Nama', m.nama) + row('NIM/NIP', m.nim) + row('Prodi/Unit', m.prodi) + row('Angkatan', m.angkatan) + row('Jenis', m.jenis) +
    row('Email', m.email) + row('No. HP', m.hp) + row('Status', m.status) + row('Berlaku s.d.', m.berlaku) + '</table>';
}
function verifBox(id, wajib) {
  return '<label class="verif"><input type="checkbox" id="' + id + '"> <span>Identitas sudah diverifikasi: nama, NIM, dan foto cocok dengan KTM/kartu anggota' + (wajib ? ' <b>(wajib)</b>' : '') + '</span></label>';
}

/* ---------- persetujuan (dasbor ACC) ---------- */
function pPersetujuan(tab) {

  tab = tab || 'booking';
  view().innerHTML = back('Persetujuan') + '<div class="chips" id="psTabs"></div><div id="psBody"><div class="loading"><span class="spin"></span></div></div>';
  const reload = () => call('persetujuan').then(d => render(d)).catch(e => { if ($('#psBody')) $('#psBody').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; });
  function render(d) {
    if (!$('#psBody')) return;
    const n = d.jumlah;

    const empty = t => '<div class="card muted small">' + t + '</div>';
    const B = $('#psBody');
    if (tab === 'booking') {
      B.innerHTML = '<p class="small muted">Booking baru dari mahasiswa. ACC: buku disiapkan (jika ada yang tersedia) atau masuk antrean.</p>' + (d.bookingAcc.length ? d.bookingAcc.map(x =>
        '<div class="card"><b>' + esc(x.judul) + '</b><div class="small muted">' + esc(x.nama) + ' (' + esc(x.nim) + ') · diajukan ' + esc(x.pesan) + '</div>' +
        '<div class="row" style="margin-top:6px"><span class="badge">Rencana ambil ' + esc(x.ambil) + '</span><span class="badge ' + (x.tersedia ? 'ok' : 'warn') + '">' + (x.tersedia ? x.tersedia + ' eksemplar tersedia' : 'Semua dipinjam → antre') + '</span></div>' +
        '<div class="row" style="margin-top:10px"><button class="btn grow" data-acb="' + esc(x.rid) + '">ACC</button><button class="btn danger grow" data-tlb="' + esc(x.rid) + '">Tolak</button></div></div>').join('') : empty('Tidak ada booking yang menunggu ACC.'));
      $$('[data-acb]').forEach(b => b.onclick = () => busy(b, async () => { const r = await call('accBooking', { rid: b.dataset.acb, setuju: true }); toast(r.status === 'Antre' ? 'Disetujui, masuk antrean ke-' + r.urutan : 'Disetujui, buku disiapkan sampai ' + r.batas, 'ok'); reload(); }).catch(() => {}));
      $$('[data-tlb]').forEach(b => b.onclick = () => askReason('Tolak booking', 'Alasan dikirim ke mahasiswa (contoh: buku khusus dosen, kuota penuh).', 'Tolak').then(al => { if (al) busy(b, async () => { await call('accBooking', { rid: b.dataset.tlb, setuju: false, alasan: al }); toast('Booking ditolak.', 'ok'); reload(); }).catch(() => {}); }));
    }
    if (tab === 'pinjam') {
      B.innerHTML = '<p class="small muted">Pengajuan pinjam mandiri. Cocokkan identitas dengan KTM dan buku fisik sebelum ACC.</p>' + (d.pinjamAcc.length ? d.pinjamAcc.map(x =>
        '<div class="card"><b>' + esc(x.judul) + '</b><div class="small muted">' + esc(x.barcode) + ' · ' + esc(x.diajukan) + '</div>' + identitasHtml(x.identitas) +

        '<button class="btn" data-ack="' + esc(x.no) + '">ACC kembali</button><button class="btn danger" data-tlk="' + esc(x.no) + '">Tolak</button></div></div>').join('') : empty('Tidak ada pengembalian yang menunggu ACC.'));
      $$('[data-ack]').forEach(b => b.onclick = () => busy(b, async () => {
        const r = await call('accKembali', { no: b.dataset.ack, setuju: true, kondisi: $('#k_' + b.dataset.ack).value });
        toast('Pengembalian diterima' + (r.denda ? ', denda ' + r.dendaTeks : '') + (r.untuk ? '. Simpan untuk booking ' + r.untuk.nama : ''), 'ok'); beep(true); reload();

      $$('[data-tlk]').forEach(b => b.onclick = () => askReason('Tolak pengembalian', 'Contoh: buku belum diserahkan, buku yang diserahkan berbeda.', 'Tolak').then(al => { if (al) busy(b, async () => { await call('accKembali', { no: b.dataset.tlk, setuju: false, alasan: al }); toast('Pengembalian ditolak.', 'ok'); reload(); }).catch(() => {}); }));
    }
    if (tab === 'perpanjang') {
      B.innerHTML = '<p class="small muted">Perpanjangan tidak dapat disetujui jika buku sedang dibooking anggota lain, agar bisa bergantian.</p>' + (d.panjangAcc.length ? d.panjangAcc.map(x =>
        '<div class="card"><b>' + esc(x.judul) + '</b><div class="small muted">' + esc(x.barcode) + ' · ' + esc(x.nama) + ' (' + esc(x.nim) + ') · perpanjangan ke-' + x.ke + '</div>' +
        '<div class="row" style="margin-top:6px"><span class="badge">Tempo ' + esc(x.tempo) + ' → ' + esc(x.tempoBaru) + '</span></div>' +
        (x.halangan ? '<div class="alert bad">' + esc(x.halangan) + '</div>' : '') +
        '<div class="row" style="margin-top:10px">' + (x.halangan ? '' : '<button class="btn grow" data-acx="' + esc(x.no) + '">ACC perpanjang</button>') + '<button class="btn danger grow" data-tlx="' + esc(x.no) + '">Tolak</button></div></div>').join('') : empty('Tidak ada perpanjangan yang menunggu ACC.'));
      $$('[data-acx]').forEach(b => b.onclick = () => busy(b, async () => { const r = await call('accPerpanjang', { no: b.dataset.acx, setuju: true }); toast(r.status === 'Disetujui' ? 'Diperpanjang sampai ' + r.tempo : 'Ditolak otomatis: ' + r.alasan, r.status === 'Disetujui' ? 'ok' : 'bad'); reload(); }).catch(() => {}));
      $$('[data-tlx]').forEach(b => {
        const x = d.panjangAcc.find(y => y.no === b.dataset.tlx);
        b.onclick = () => (x && x.halangan ? Promise.resolve(x.halangan) : askReason('Tolak perpanjangan', 'Contoh: buku sedang dibooking, mohon dikembalikan.', 'Tolak'))
          .then(al => { if (al) busy(b, async () => { await call('accPerpanjang', { no: b.dataset.tlx, setuju: false, alasan: al }); toast('Perpanjangan ditolak.', 'ok'); reload(); }).catch(() => {}); });
      });
    }
    if (tab === 'jadwal') {
      const by = {}; d.jadwal.forEach(x => { (by[x.ambil || 'Tanpa tanggal'] = by[x.ambil || 'Tanpa tanggal'] || []).push(x); });
      B.innerHTML = '<p class="small muted">Semua booking aktif, diurutkan menurut rencana tanggal ambil. Petugas dapat membatalkan booking, misalnya karena buku didahulukan untuk dosen.</p>' +
        (d.jadwal.length ? Object.keys(by).map(k => '<h3>' + esc(k) + '</h3>' + by[k].map(x => '<div class="card"><b>' + esc(x.judul) + '</b><div class="small muted">' + esc(x.nama) + ' (' + esc(x.nim) + ')' + (x.barcode ? ' · disiapkan ' + esc(x.barcode) : '') + '</div>' +

        '<div class="tile"><b>' + dd.transaksi + '</b><span>Transaksi belum lunas</span></div><div class="tile"><b>' + rp(dd.lunasBulanIni) + '</b><span>Denda lunas bulan ini</span></div></div>' +

          '<button class="btn sm" data-ln="' + esc(x.no) + '">Lunas</button>' + (isAdmin() ? '<button class="btn sm ghost" data-bb="' + esc(x.no) + '">Bebaskan</button>' : '') + '</div>').join('') : '');
      $$('[data-ln]').forEach(b => b.onclick = () => busy(b, async () => { await call('lunas', { no: b.dataset.ln, mode: 'Lunas' }); toast('Denda ditandai lunas.', 'ok'); reload(); }).catch(() => {}));
      $$('[data-bb]').forEach(b => b.onclick = () => confirmBox('Bebaskan denda?', 'Denda transaksi ini tidak akan ditagih.', 'Bebaskan').then(y => { if (y) busy(b, async () => { await call('lunas', { no: b.dataset.bb, mode: 'Dibebaskan' }); reload(); }).catch(() => {}); }));
    }

  reload();
}

function pSirkulasi() {
  view().innerHTML = back('Peminjaman') + '<div class="card"><label class="f">1. NIM peminjam</label>' + scanField('sNim', 'Ketik / scan NIM atau kartu anggota', 'numeric') + '</div><div id="sCard"></div><div id="sDone"></div>';
  let cur = null;
  const load = nim => busy(null, async () => {
    loading($('#sCard'));
    const a = await call('anggota', { nim }); cur = a; renderCard(a);
  }).catch(e => { if ($('#sCard')) $('#sCard').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>'; });
  function renderCard(a, keepVerif) {
    if (!$('#sCard')) return;
    const ok = !a.alasan.length;
    $('#sCard').innerHTML = '<div class="card"><div class="row"><div class="grow"><b style="font-size:17px">' + esc(a.nama) + '</b><div class="small muted">' + esc(a.nim) + ' · ' + esc(a.prodi || a.jenis) + '</div></div>' +
      '<span class="badge ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'Boleh meminjam' : 'Diblokir') + '</span></div>' +
      '<details' + (keepVerif ? '' : ' open') + '><summary style="cursor:pointer;font-weight:600;margin-top:8px">Data identitas</summary>' + identitasHtml(a) + '</details>' +
      (ok ? '' : '<div class="alert bad">' + a.alasan.map(esc).join('<br>') + '</div>') +
      (a.pesan.length ? '<h3>Booking</h3><div class="list">' + a.pesan.map(p => '<div class="row"><div class="grow"><b>' + esc(p.judul) + '</b><div class="small muted">' + (p.barcode ? 'disiapkan ' + esc(p.barcode) + ' · ' : '') + 'rencana ambil ' + esc(p.ambil || '-') + '</div></div>' + resLine(Object.assign({}, p, { ambil: '' })) +
        '<button class="btn sm danger" data-btl="' + esc(p.rid) + '">Batalkan</button></div>').join('') + '</div>' : '') +
      (a.aktif.length ? '<h3>Sedang dipinjam</h3><div class="list">' + a.aktif.map(x => '<div class="row"><div class="grow"><div style="font-weight:600">' + esc(x.judul) + '</div><div class="small muted">' + esc(x.barcode) + ' · tempo ' + esc(x.tempo) + (x.status !== 'Dipinjam' ? ' · pengembalian diajukan' : '') + '</div></div>' +
        (x.terlambat ? '<span class="badge bad">+' + x.terlambat + ' hr ' + rp(x.denda) + '</span>' : '<button class="btn sm sec" data-pp="' + esc(x.barcode) + '">Perpanjang</button>') + '</div>').join('') + '</div>' : '') +
      (a.denda.length ? '<h3>Denda belum lunas</h3><div class="list">' + a.denda.map(d => '<div class="row"><div class="grow">' + esc(d.judul) + '<div class="small muted">' + esc(d.no) + '</div></div><b style="color:var(--bad)">' + rp(d.denda) + '</b>' +
        '<button class="btn sm" data-ln="' + esc(d.no) + '">Lunas</button>' + (isAdmin() ? '<button class="btn sm ghost" data-bb="' + esc(d.no) + '">Bebaskan</button>' : '') + '</div>').join('') + '</div>' : '') +
      '<div style="margin-top:12px">' + verifBox('sVer', a.wajibVerif) + '</div>' +
      '<label class="f" style="margin-top:10px">2. Scan buku yang dipinjam</label>' + scanField('sBk', 'Barcode buku') + '</div>';
    if (keepVerif) $('#sVer').checked = true;
    bindScan('sBk', doLoan, { title: 'Scan buku untuk ' + a.nama, continuous: true, onCode: async code => { const r = await doLoan(code, true); return { msg: r.judul + ' · tempo ' + r.tempo }; } });
    $$('[data-pp]').forEach(b => b.onclick = () => busy(b, async () => { const r = await call('perpanjangPetugas', { nim: a.nim, barcode: b.dataset.pp }); toast('Diperpanjang sampai ' + r.tempo, 'ok'); load(a.nim); }).catch(() => {}));
    $$('[data-ln]').forEach(b => b.onclick = () => busy(b, async () => { await call('lunas', { no: b.dataset.ln, mode: 'Lunas' }); toast('Denda ditandai lunas.', 'ok'); load(a.nim); }).catch(() => {}));
    $$('[data-bb]').forEach(b => b.onclick = () => confirmBox('Bebaskan denda?', 'Denda transaksi ini tidak akan ditagih.', 'Bebaskan').then(y => { if (y) busy(b, async () => { await call('lunas', { no: b.dataset.bb, mode: 'Dibebaskan' }); load(a.nim); }).catch(() => {}); }));
    $$('[data-btl]').forEach(b => b.onclick = () => askReason('Batalkan booking', 'Alasan dikirim ke mahasiswa.', 'Batalkan').then(al => { if (al) busy(b, async () => { await call('batalBooking', { rid: b.dataset.btl, alasan: al }); toast('Booking dibatalkan.', 'ok'); load(a.nim); }).catch(() => {}); }));
  }
  async function doLoan(code, fromScanner) {
    const run = async () => {
      const v = $('#sVer') && $('#sVer').checked;
      const r = await call('pinjam', { nim: cur.nim, barcode: code, verif: v });
      $('#sDone').insertAdjacentHTML('afterbegin', '<div class="alert ok">✔ <b>' + esc(r.judul) + '</b> (' + esc(r.barcode) + ') dipinjam ' + esc(r.nama) + '. Kembali paling lambat <b>' + esc(r.tempo) + '</b>.</div>');
      if (!fromScanner) { beep(true); toast('Peminjaman tersimpan.', 'ok'); }
      cur = await call('anggota', { nim: cur.nim }); renderCard(cur, v);
      return r;
    };
    if (fromScanner) return run();
    return busy(null, run).catch(() => {});
  }
  bindScan('sNim', load, { title: 'Scan NIM / kartu anggota' });
  setTimeout(() => $('#sNim').focus(), 50);
}

/* ---------- anggota & kartu ---------- */
function printKartu(d) {
  const area = $('#printArea'); area.innerHTML = '';
  const per = 10;
  for (let i = 0; i < d.kartu.length; i += per) {
    const page = document.createElement('div'); page.className = 'kartusheet'; if (i) page.style.breakBefore = 'page';
    d.kartu.slice(i, i + per).forEach(k => {
      const el = document.createElement('div'); el.className = 'kartu';
      el.innerHTML = '<div class="kh"><b>' + esc(d.nama || '') + '</b><span>' + esc(d.instansi || '') + '</span></div><div class="kt">KARTU ANGGOTA</div>' +
        '<div class="kn">' + esc(k.nama) + '</div><div class="ks">' + esc(k.nim) + ' · ' + esc(k.prodi || k.jenis || '') + (k.angkatan ? ' · ' + esc(k.angkatan) : '') + '</div>' +
        '<div class="kb"></div><div class="kf">' + (k.berlaku ? 'Berlaku s.d. ' + esc(k.berlaku) : 'Kartu ini milik perpustakaan. Wajib dibawa saat meminjam.') + '</div>';
      $('.kb', el).appendChild(barcodeSvg(k.nim, { height: 40 }));
      page.appendChild(el);
    });
    area.appendChild(page);
  }
  setTimeout(() => window.print(), 300);
}

function barcodeSvg(code, opts) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  try { JsBarcode(svg, code, Object.assign({ format: 'CODE128', displayValue: false, margin: 0, height: 100, width: 2 }, opts || {})); svg.setAttribute('preserveAspectRatio', 'none'); }
  catch (e) { /* kode tidak valid */ }
  return svg;
}
function printLabels(d) {

/* ---------- rekap ---------- */
function barChart(labels, a, b, width) {
  const W = width || 640, H = 230, pl = 34, pb = 26, pt = 10, n = labels.length, max = Math.max(1, ...a, ...b);
  const step = (W - pl - 6) / n, bw = Math.max(2, Math.min(16, step / 2 - 2)), y = v => pt + (H - pt - pb) * (1 - v / max);
  const ticks = [0, Math.round(max / 2), max];
  let s = '<svg class="bars" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Grafik kunjungan dan peminjaman">';
  ticks.forEach(t => { s += '<line x1="' + pl + '" x2="' + W + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#e3e9e7"/><text x="' + (pl - 6) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" fill="#5b6b70">' + t + '</text>'; });
  labels.forEach((l, i) => {
    const x = pl + i * step + step / 2;
    s += '<rect x="' + (x - bw - 1) + '" y="' + y(a[i]) + '" width="' + bw + '" height="' + (H - pb - y(a[i])) + '" rx="2" fill="#2f6f7e"><title>' + esc(l) + ': ' + a[i] + ' kunjungan</title></rect>';
    s += '<rect x="' + (x + 1) + '" y="' + y(b[i]) + '" width="' + bw + '" height="' + (H - pb - y(b[i])) + '" rx="2" fill="#c8873a"><title>' + esc(l) + ': ' + b[i] + ' peminjaman</title></rect>';
    if (n <= 16 || i % Math.ceil(n / 12) === 0) s += '<text x="' + x + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#5b6b70">' + esc(l) + '</text>';
  });
  return s + '</svg>';
}

      '<h3 style="margin-top:0">Data judul baru</h3>' + f('judul', 'Judul *') + f('pengarang', 'Pengarang (pisahkan dengan ;)') + f('penerbit', 'Penerbit') + f('kota', 'Kota terbit') +
      '<div class="row"><div class="grow">' + f('tahun', 'Tahun', '2025') + '</div><div class="grow">' + f('isbn', 'ISBN') + '</div></div>' +
      f('call', 'Nomor panggil *', '371.3 JOE k') + f('subjek', 'Subjek') + '<label class="f">Jenis koleksi</label><select id="tf_jenis"><option>Buku</option><option>Skripsi</option><option>File Digital</option><option>CD/Software</option></select>' + f('edisi', 'Edisi/cetakan')) +
      '<div class="row"><div class="grow"><label class="f">Jumlah eksemplar</label><input id="tf_jumlah" type="number" min="1" max="50" value="1"></div><div class="grow"><label class="f">Lokasi rak</label><input id="tf_rak" placeholder="R-01"></div></div>' +
      f('sumber', 'Sumber / catatan', 'Pembelian 2026, hibah, dll.') + '<button class="btn block" id="tSave" style="margin-top:12px">Simpan & buat barcode</button></div>';
    if (!id && $('#tq').value && /^[0-9xX-]{10,17}$/.test($('#tq').value.trim())) $('#tf_isbn').value = $('#tq').value.trim();
    $('#tSave').onclick = () => busy($('#tSave'), async () => {
      const v = k => ($('#tf_' + k) || {}).value || '';
      const r = await call('tambahBuku', { id, jumlah: v('jumlah'), rak: v('rak'), sumber: v('sumber'),
        data: id ? null : { judul: v('judul'), pengarang: v('pengarang'), penerbit: v('penerbit'), kota: v('kota'), tahun: v('tahun'), isbn: v('isbn'), call: v('call'), subjek: v('subjek'), jenis: v('jenis'), edisi: v('edisi') } });
      beep(true);
      $('#tForm').innerHTML = '<div class="card"><div class="alert ok">Tersimpan: <b>' + esc(r.judul) + '</b> (' + esc(r.id) + ')</div><p>Barcode baru:</p><p style="font-size:18px;font-weight:700">' + r.barcodes.map(esc).join(', ') + '</p>' +
        '<p class="small muted">Barcode sudah masuk antrean cetak label.</p><button type="button" class="btn block" data-nav="petugas/label">Buka Cetak label</button></div>';
      window.scrollTo(0, document.body.scrollHeight);
    }).catch(() => {});
    window.scrollTo(0, document.body.scrollHeight);
  }
}

/* ---------- admin: status eksemplar & reset PIN ---------- */
function pStatus() {
  view().innerHTML = back('Status eksemplar') + '<div class="card"><label class="f">Scan barcode buku</label>' + scanField('eBc', 'Barcode') + '</div><div id="eOut"></div>';
  const load = code => busy(null, async () => {
    const e = await call('eksemplar', { barcode: code });
    const sel = (id, opts, val) => '<select id="' + id + '">' + opts.map(o => '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>';
    $('#eOut').innerHTML = '<div class="card"><b style="font-size:16px">' + esc(e.Judul) + '</b><div class="small muted">' + esc(e.Barcode) + ' · ' + esc(e['No. Panggil']) + ' ' + esc(e.Salinan) + ' · rak ' + esc(e['Lokasi Rak'] || '-') + '</div>' +
      '<div class="row" style="margin:8px 0"><span class="badge">' + esc(e.Status || 'Tersedia') + '</span><span class="badge">' + esc(e.Kondisi || 'Baik') + '</span></div>' +
      (e.peminjam ? '<div class="alert warn">Sedang dipinjam ' + esc(e.peminjam) + ', tempo ' + esc(e.tempo) + '</div>' : '') +
      '<label class="f">Status baru</label>' + sel('eSt', ['Tersedia', 'Perbaikan', 'Hilang', 'Dihapus', 'Baca di tempat'], e.Status) +
      '<label class="f">Kondisi</label>' + sel('eKo', ['Baik', 'Rusak ringan', 'Rusak berat'], e.Kondisi || 'Baik') +
      '<label class="f">Catatan / alasan</label><input id="eCa" placeholder="Contoh: sampul sobek, diganti pengguna"><button class="btn block" id="eSave" style="margin-top:12px">Simpan</button>' +
      '<p class="small muted">Baris tidak pernah dihapus dari sheet; status "Dihapus" menyembunyikan buku dari katalog tanpa menghilangkan riwayat.</p></div>';
    $('#eSave').onclick = () => busy($('#eSave'), async () => {
      const r = await call('ubahEksemplar', { barcode: e.Barcode, status: $('#eSt').value, kondisi: $('#eKo').value, catatan: $('#eCa').value });
      beep(true); toast('Status ' + r.barcode + ': ' + r.status, 'ok'); load(e.Barcode);
    }).catch(() => {});
  }).catch(err => { if ($('#eOut')) $('#eOut').innerHTML = '<div class="alert bad">' + esc(err.message) + '</div>'; });
  bindScan('eBc', load, { title: 'Scan buku' });
  setTimeout(() => $('#eBc').focus(), 50);
}
function pReset() {
  view().innerHTML = back('Reset PIN anggota') + '<div class="card"><label class="f">NIM</label><input id="rsN" inputmode="numeric"><button class="btn block" id="rsGo" style="margin-top:12px">Reset ke PIN awal</button>' +
    '<p class="small muted">PIN kembali menjadi 6 digit terakhir NIM. Minta anggota segera menggantinya.</p></div><div id="rsOut"></div>';
  $('#rsGo').onclick = () => { if (confirm('Reset PIN untuk NIM ' + $('#rsN').value + '?')) busy($('#rsGo'), async () => {
    const r = await call('resetPin', { nim: $('#rsN').value });
    $('#rsOut').innerHTML = '<div class="alert ok">PIN ' + esc(r.nama) + ' direset. PIN sementara: <b>' + esc(r.pin) + '</b></div>';
  }).catch(() => {}); };
}

/* ---------- mulai ---------- */
function applyBoot() {
  if (B.mode === 'kiosk') document.body.classList.add('kiosk');
  S.info = { nama: B.nama || 'Perpustakaan', instansi: B.instansi || '', mandiri: !!B.mandiri };
  $('#appName').textContent = S.info.nama; $('#appSub').textContent = (S.info.instansi ? S.info.instansi + ' · ' : '') + 'Layanan digital';
  try { document.title = S.info.nama + ' - Layanan Digital'; } catch (e) {}
}
function fatal(msg) {
  view().innerHTML = '<div class="card"><div class="alert bad"><b>Aplikasi belum siap.</b><br>' + esc(msg) + '</div>' +
    '<p class="small muted">Untuk admin: periksa SPREADSHEET_ID di Code.gs, jalankan fungsi setup, dan pastikan Web App di-deploy dengan akses "Siapa saja". ' +
    'Jika memakai GitHub Pages, periksa API_URL di index.html.</p><button class="btn block" id="retry">Coba lagi</button></div>';
  $('#retry').onclick = () => location.reload();
}
(async function init() {
  const qs = new URLSearchParams(location.search);
  if (B.remote) {
    B = { mode: qs.get('mode') === 'kiosk' ? 'kiosk' : '', page: qs.get('page') || '' };
    applyBoot();
    if (!apiReady()) { fatal('API_URL belum diisi di file index.html. Isi dengan alamat Web App Apps Script (berakhiran /exec).'); return; }
    try { const r = await call('boot', { mode: B.mode }); B = Object.assign(r, { mode: B.mode, page: B.page }); }
    catch (e) { fatal(e.message); return; }
  }
  applyBoot();
  if (B.error) { fatal(B.error); return; }
  loadSess();
  route();
})();
</script>
